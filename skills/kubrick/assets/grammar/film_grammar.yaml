    evidence: Working definition for the Kubrick film-grammar registry.
    aliases: [crane, pedestal, crane up, pedestal down]
  - id: handheld
    category: move
    definition: The camera is carried. Small unsteady shifts in the frame come from the operator, not from the subject shaking.
    prompt_phrase: handheld camera with visible operator sway
    conflicts: []
    evidence: MYSLEF EP-01 shot 04 continues handheld off the previous shot.
    aliases: [handheld, hand-held, hand held]
  - id: stabilised-float
    category: move
    definition: The camera travels smoothly, as if floated. The path can move, but handheld shake stays out of the frame.
    prompt_phrase: stabilised float, a smooth moving camera without handheld shake
    conflicts: []
    evidence: Working definition for the Kubrick film-grammar registry.
    aliases: [stabilised, stabilized, stabilised float, stabilized float]
  - id: zoom
    category: move
    definition: Focal length changes during the shot while the camera body stays in one place. The frame tightens or widens without a dolly.
    prompt_phrase: zoom, focal length changing while the camera body stays put
    conflicts: []
    evidence: Working definition for the Kubrick film-grammar registry.
    aliases: [zoom, zoom in, zoom out]
  - id: rack-focus
    category: move
    definition: Focus shifts from one distance to another during the shot. One plane goes soft as another becomes sharp.
    prompt_phrase: rack focus from one plane to another
    conflicts: []
    evidence: Working definition for the Kubrick film-grammar registry.
    aliases: [rack focus, rack-focus, pull focus]

  - id: practical-only
