  prompt_phrase: lead room in front of the subject's look or movement
  conflicts:
  - short-side
  - centre-punch
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - lead room
  - lead-room
  - looking room
  provider_notes: Space on facing side; state gaze direction and side explicitly.
  targets:
    lead_room_frac:
    - 0.55
    - 0.7
- id: vertical-stack
  category: composition_9_16
  definition: In a 9:16 frame, the important shapes are stacked up the tall frame instead of spread across
