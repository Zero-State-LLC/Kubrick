  prompt_phrase: vertical stacking of the important shapes in the 9:16 frame
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - vertical stack
  - vertical stacking
  - vertical-stack
  provider_notes: Stack in depth top/bottom; keep faces in central band y 0.12-0.75.
  targets:
    eye_y:
    - 0.2
    - 0.45
- id: deep-background
  category: composition_9_16
  definition: A small figure stays readable deep in the tall frame, behind whatever is close to the lens.
  prompt_phrase: a deep-background figure still readable in the tall frame
  conflicts: []
