  - id: overhead
    category: angle
    definition: The lens looks nearly straight down, so the floor plan reads more than the face.
    prompt_phrase: overhead angle, looking nearly straight down
    conflicts: []
    evidence: Working definition for the Kubrick film-grammar registry.
    aliases: [overhead, top down, bird's eye]
  - id: dutch
    category: angle
    definition: The horizon is canted, so verticals in the room lean in the frame.
