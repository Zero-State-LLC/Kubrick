  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - crane
  - pedestal
  - crane up
  - pedestal down
- id: handheld
  category: move
  definition: The camera is carried. Small unsteady shifts in the frame come from the operator, not from
