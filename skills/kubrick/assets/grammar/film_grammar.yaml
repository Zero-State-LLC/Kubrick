  prompt_phrase: zoom, focal length changing while the camera body stays put
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - zoom
  - zoom in
  - zoom out
- id: rack-focus
  category: move
  definition: Focus shifts from one distance to another during the shot. One plane goes soft as another
    becomes sharp.
  prompt_phrase: rack focus from one plane to another
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - rack focus
  - rack-focus
  - pull focus
- id: practical-only
  category: lighting
  definition: The only sources are lamps, screens, or other fixtures that belong in the room. No extra
    movie light is added.
  prompt_phrase: practical-only light from sources inside the room
  conflicts:
  - high-key
  - three-point
  evidence: MYSLEF EP-01 shots 03 to 06 are lit by the racks and one laptop.
  aliases:
  - practical
  - practical only
  - practical-only
  provider_notes: List practicals with screen positions; character emitters must be declared (emitters-dark).
- id: motivated-key
  category: lighting
  definition: The main light has a reason inside the scene, such as a window, a screen, or a lamp the
    audience can place.
  prompt_phrase: motivated key light from a source in the scene
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - motivated
  - motivated key
  - motivated-key
  provider_notes: Name source object and screen side; renders brighter than asked — ask darker.
  targets:
    key_fill_stops:
    - 1.0
    - 3.0
- id: low-key
  category: lighting
  definition: Most of the frame stays dark. Small areas carry the light, and shadows stay heavy.
  prompt_phrase: low-key lighting, mostly dark with small bright areas
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - low key
  - low-key
- id: high-key
  category: lighting
  definition: The frame is bright overall. Shadows are soft and deep black is scarce.
  prompt_phrase: high-key lighting, bright with soft shadows
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - high key
  - high-key
- id: silhouette
  category: lighting
  definition: The subject reads as a dark shape against a brighter ground. Facial detail is not the point
