  prompt_phrase: handheld camera with visible operator sway
  conflicts: []
  evidence: MYSLEF EP-01 shot 04 continues handheld off the previous shot.
  aliases:
  - handheld
  - hand-held
  - hand held
- id: stabilised-float
  category: move
  definition: The camera travels smoothly, as if floated. The path can move, but handheld shake stays
