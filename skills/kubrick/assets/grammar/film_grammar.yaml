    aliases: [ots, over the shoulder, over-the-shoulder]

  - id: ultra-wide
    category: lens_band
    definition: An ultra-wide lens, about 14 to 24 mm, bends straight lines near the edges and stretches the depth of a room.
    prompt_phrase: ultra-wide lens, about 14 to 24 millimetres
    conflicts: []
    evidence: Working definition for the Kubrick film-grammar registry.
    aliases: [ultra wide, ultra-wide, 14mm, 24mm]
    lens_mm_min: 14
    lens_mm_max: 24
  - id: wide-lens
    category: lens_band
    definition: A wide lens, about 28 to 35 mm, keeps the room readable without the strong bend of an ultra-wide.
    prompt_phrase: wide lens, about 28 to 35 millimetres
    conflicts: []
    evidence: MYSLEF EP-01 shots 03 and 06 are 35 mm.
    aliases: [wide lens, 28mm, 35mm]
    lens_mm_min: 28
    lens_mm_max: 35
  - id: normal-lens
    category: lens_band
    definition: A normal lens, around 50 mm, keeps relative sizes close to what the eye expects at that distance.
    prompt_phrase: normal lens, around 50 millimetres
    conflicts: []
    evidence: Working definition for the Kubrick film-grammar registry.
    aliases: [normal, normal lens, 50mm]
    lens_mm_min: 40
    lens_mm_max: 65
  - id: short-tele
    category: lens_band
    definition: A short telephoto, around 85 mm, compresses the face slightly and lets the background fall back.
    prompt_phrase: short telephoto, around 85 millimetres
    conflicts: []
    evidence: MYSLEF EP-01 shot 05 is 85 mm.
    aliases: [short tele, short telephoto, 85mm, 85 mm]
    lens_mm_min: 70
    lens_mm_max: 110
  - id: long-tele
    category: lens_band
    definition: A long telephoto, 135 mm or longer, stacks distant planes together and isolates a small subject.
    prompt_phrase: long telephoto, 135 millimetres or longer
    conflicts: []
    evidence: Working definition for the Kubrick film-grammar registry.
    aliases: [long tele, long telephoto, 135mm]
    lens_mm_min: 135
  - id: macro
    category: lens_band
    definition: Macro framing focuses very near a surface. The subject is large in frame and the background drops out of focus.
    prompt_phrase: macro focus on a near surface
    conflicts: []
    evidence: Working definition for the Kubrick film-grammar registry.
    aliases: [macro, macro lens]

  - id: static
    category: move
    definition: The camera stays fixed. It does not travel, pan, tilt, or zoom during the shot.
    prompt_phrase: locked-off camera, static, with no travel
    conflicts: []
    evidence: MYSLEF EP-01 shot 05 is a locked view.
    aliases: [static, locked, locked-off, locked off]
  - id: pan
    category: move
    definition: The camera turns left or right from one fixed spot, without travelling through the room.
    prompt_phrase: pan left or right from a fixed spot
    conflicts: []
    evidence: Working definition for the Kubrick film-grammar registry.
    aliases: [pan]
  - id: tilt
    category: move
    definition: The camera pivots up or down from one fixed spot. A tilt-down aims the lens toward the floor.
    prompt_phrase: tilt up or down from a fixed spot
    conflicts: []
    evidence: MYSLEF EP-01 shot 04 tilts down near 4.1 seconds.
    aliases: [tilt, tilt-down, tilt down, tilt-up, tilt up]
  - id: snap-pan
    category: move
    definition: A snap pan yanks the aim from one direction to another in a single fast turn, with no travel of the camera body.
    prompt_phrase: snap pan, a sudden fast pan to a new aim
    conflicts: [chain_from_start_frame]
    evidence: MYSLEF EP-01 lost a snap pan on shot 04 because that shot chained from shot 03's last frame.
    provider_notes: A chain that starts on an earlier frame already shows that frame, so the discontinuous pan is not visible inside the chain.
    aliases: [snap, snap pan, snap-pan]
  - id: whip-pan
    category: move
    definition: A whip pan turns so fast that the middle of the move smears and the new aim arrives at the end.
    prompt_phrase: whip pan, a pan fast enough to blur the middle
    conflicts: [chain_from_start_frame]
    evidence: Working definition for the Kubrick film-grammar registry. The same chain limit as a snap pan applies.
    provider_notes: A chained start image cannot show the blurred middle of a whip. The conflict is warned instead of dropped in silence.
    aliases: [whip, whip pan, whip-pan]
  - id: push-in
    category: move
    definition: The camera travels forward along its lens axis, so the subject grows in frame without a zoom.
    prompt_phrase: push-in toward the subject
    conflicts: []
    evidence: MYSLEF EP-01 shots 03 and 06 are 35 mm push-ins.
    aliases: [push in, push-in, slow push-in, slow push in]
  - id: pull-out
    category: move
    definition: The camera travels backward along its lens axis, so more of the room enters the frame.
    prompt_phrase: pull-out away from the subject
    conflicts: []
    evidence: Working definition for the Kubrick film-grammar registry.
    aliases: [pull out, pull-out]
  - id: dolly
    category: move
    definition: The camera travels on a mount. A dolly moves along the lens axis and a truck moves sideways. The body of the camera changes place.
    prompt_phrase: dolly or truck, the camera travelling on a mount
    conflicts: []
    evidence: Working definition for the Kubrick film-grammar registry.
    aliases: [dolly, truck, dolly in, truck left]
  - id: track
    category: move
    definition: The camera travels with a moving subject and keeps that subject in frame while the background slides.
    prompt_phrase: tracking shot that follows the moving subject
    conflicts: []
    evidence: Working definition for the Kubrick film-grammar registry.
    aliases: [track, tracking, follow, follow shot]
  - id: arc
    category: move
    definition: The camera moves in a curve around the subject, so the background swings behind them.
    prompt_phrase: arc or orbit around the subject
    conflicts: []
    evidence: Working definition for the Kubrick film-grammar registry.
    aliases: [arc, orbit, arc shot]
  - id: crane
    category: move
    definition: The camera rises or drops as a unit, on a crane arm or a pedestal, rather than only tilting from a fixed head.
    prompt_phrase: crane or pedestal move, the camera rising or dropping
