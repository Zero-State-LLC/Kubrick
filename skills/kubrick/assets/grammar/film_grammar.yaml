    evidence: Working definition for the Kubrick film-grammar registry.
    aliases: [medium wide, medium-wide, medium wide shot]
  - id: ms
    category: shot_size
    definition: A medium shot holds the body from about the waist upward.
    prompt_phrase: medium shot, from about the waist up
    conflicts: []
    evidence: Working definition for the Kubrick film-grammar registry.
    aliases: [medium, medium shot]
  - id: mcu
    category: shot_size
    definition: A medium close-up holds the head and shoulders and cuts near the chest.
    prompt_phrase: medium close-up, head and shoulders
    conflicts: []
    evidence: Working definition for the Kubrick film-grammar registry.
    aliases: [medium close-up, medium close up, mcu]
  - id: cu
    category: shot_size
    definition: A close-up lets the face, or one object, fill most of the frame.
    prompt_phrase: close-up, the face or one object filling the frame
