  - id: hard-cut
    category: edit
    definition: The picture changes in one frame. There is no dissolve, wipe, or fade between the two shots.
    prompt_phrase: hard cut into the frame
    conflicts: []
    evidence: Working definition for the Kubrick film-grammar registry.
    aliases: [hard cut, hard-cut, straight cut]
  - id: match-on-action
    category: edit
    definition: The cut lands while a movement is still going, so the action continues across the join.
    prompt_phrase: match on action, the movement continuing across the cut
    conflicts: []
    evidence: Working definition for the Kubrick film-grammar registry.
    aliases: [match on action, match-on-action]
  - id: graphic-match
    category: edit
    definition: The cut joins two frames that share a shape, a line, or a placement, so the eye lands on the echo.
    prompt_phrase: graphic match, a shared shape across the cut
    conflicts: []
    evidence: Working definition for the Kubrick film-grammar registry.
    aliases: [graphic match, graphic-match]
  - id: cut-on-sound
    category: edit
    definition: The picture changes on a sound accent. The cut is timed to the hit, not to the end of a movement.
    prompt_phrase: cut on a sound accent
    conflicts: []
    evidence: MYSLEF EP-01 shot 06 cuts on the bass peak at 9.25 seconds.
    aliases: [cut on sound, cut-on-sound, cut on the bass, cut on bass]
  - id: j-cut
    category: edit
    definition: Sound from the incoming shot starts before the picture cuts to it. The audience hears the next shot first.
    prompt_phrase: J-cut, incoming sound starting before the picture
    conflicts: []
    evidence: Working definition for the Kubrick film-grammar registry.
    provider_notes: The picture prompt can name the early sound. The overlap itself is an edit decision.
    aliases: [j-cut, j cut, jcut]
  - id: l-cut
    category: edit
    definition: Sound from the outgoing shot keeps playing after the picture has cut away.
    prompt_phrase: L-cut, outgoing sound continuing after the picture cut
    conflicts: []
    evidence: Working definition for the Kubrick film-grammar registry.
    provider_notes: The picture prompt can name the lingering sound. The overlap itself is an edit decision.
    aliases: [l-cut, l cut, lcut]
  - id: smash-cut
    category: edit
    definition: A hard cut that arrives with a sharp jump in energy, scale, or loudness. The join itself is abrupt.
    prompt_phrase: smash cut, an abrupt hard cut
