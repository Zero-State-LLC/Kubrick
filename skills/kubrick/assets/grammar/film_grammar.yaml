schema_version: 1.1.0
entries:
- id: ews
  category: shot_size
  definition: An extreme wide shot holds a large field. Any figure reads as small against the place.
  prompt_phrase: extreme wide shot, the figure small in a large field
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - extreme wide
  - extreme wide shot
  - extreme-wide
- id: ws
  category: shot_size
  definition: A wide shot shows the whole body and enough of the room to place it.
  prompt_phrase: wide shot, full body with room around it
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - wide
  - wide shot
- id: fs
  category: shot_size
  definition: A full shot frames the body from head to feet, with little spare space above or below.
  prompt_phrase: full shot, head to feet
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - full shot
  - full-shot
- id: mws
  category: shot_size
  definition: A medium-wide shot cuts the body around the knees and still leaves space at the sides.
  prompt_phrase: medium-wide shot, cut near the knees
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - medium wide
  - medium-wide
  - medium wide shot
  provider_notes: Mid-thigh crop; wide plate pulls it to full body (EP-01 shot 11) — pre-crop location
    ref.
  targets:
    crop_landmark: mid_thigh
    crop_margin:
    - 0.04
    - 1.0
    lens_mm:
    - 35
    - 50
- id: ms
  category: shot_size
  definition: A medium shot holds the body from about the waist upward.
  prompt_phrase: medium shot, from about the waist up
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - medium
  - medium shot
  provider_notes: Waist-up; say 'waist-up medium shot, 50mm'.
  targets:
    crop_landmark: waist_above
    head_ratio:
    - 0.36
    - 0.46
    lens_mm:
    - 40
    - 65
- id: mcu
  category: shot_size
  definition: A medium close-up holds the head and shoulders and cuts near the chest.
  prompt_phrase: medium close-up, head and shoulders
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - medium close-up
  - medium close up
  - mcu
  provider_notes: Crop mid-chest; name 85mm.
  targets:
    crop_landmark: mid_chest
    head_ratio:
    - 0.38
    - 0.46
    lens_mm:
    - 65
    - 100
- id: cu
  category: shot_size
  definition: A close-up lets the face, or one object, fill most of the frame.
  prompt_phrase: close-up, the face or one object filling the frame
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - close-up
  - close up
  provider_notes: Most stable size in AI; 85mm phrase helps.
  targets:
    crop_landmark: shoulders_top
    headroom_frac:
    - 0.02
    - 0.08
    lens_mm:
    - 70
    - 110
- id: ecu
  category: shot_size
  definition: An extreme close-up fills the frame with one small detail, such as an eye or a crack.
  prompt_phrase: ECU, an extreme close-up filling the frame with one detail
  conflicts: []
  evidence: MYSLEF EP-01 shot 05 is an 85 mm locked ECU on the cracked optic.
  aliases:
  - extreme close-up
  - extreme close up
- id: insert
  category: shot_size
  definition: An insert is a tight view of a prop or detail, cut in beside the wider action.
  prompt_phrase: insert of one prop or detail
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - insert shot
  - detail insert
- id: eye-level
  category: angle
  definition: The lens sits near the subject's eye height, so the view is not looking up or down.
  prompt_phrase: eye-level camera
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - eye level
  - eye-level
- id: low-angle
  category: angle
  definition: The lens looks up at the subject from below eye height.
  prompt_phrase: low angle, looking up at the subject
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - low
  - low angle
  - low-angle
- id: high-angle
  category: angle
  definition: The lens looks down on the subject from above eye height.
  prompt_phrase: high angle, looking down on the subject
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - high
  - high angle
  - high-angle
- id: overhead
  category: angle
  definition: The lens looks nearly straight down, so the floor plan reads more than the face.
  prompt_phrase: overhead angle, looking nearly straight down
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - overhead
  - top down
  - bird's eye
- id: dutch
  category: angle
  definition: The horizon is canted, so verticals in the room lean in the frame.
  prompt_phrase: dutch angle, horizon tilted
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - dutch
  - dutch angle
  - dutch tilt
- id: pov
  category: angle
  definition: The frame is what one character sees, without showing that character's face as the viewer.
  prompt_phrase: point-of-view angle, seen through a character's eyes
  conflicts:
  - ots
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - pov
  - point of view
  - point-of-view
  provider_notes: 'Asymmetry mirrors: cracked view on screen right (EP-01). No quoted words in HUD.'
- id: ots
  category: angle
  definition: One character's shoulder or the back of the head stays in the foreground while the lens
    faces someone else.
  prompt_phrase: over-the-shoulder angle, a foreground shoulder facing the other person
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - ots
  - over the shoulder
  - over-the-shoulder
  provider_notes: Foreground shoulder often vanishes; phrase 'behind their left shoulder, shoulder soft
    in the lower left of frame'. Crop target is untested and needs a review.
  targets:
    crop_margin:
    - 0.0
    - 0.0
- id: ultra-wide
  category: lens_band
  definition: An ultra-wide lens, about 14 to 24 mm, bends straight lines near the edges and stretches
    the depth of a room.
  prompt_phrase: ultra-wide lens, about 14 to 24 millimetres
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - ultra wide
  - ultra-wide
  - 14mm
  - 24mm
  lens_mm_min: 14
  lens_mm_max: 24
- id: wide-lens
  category: lens_band
  definition: A wide lens, about 28 to 35 mm, keeps the room readable without the strong bend of an ultra-wide.
  prompt_phrase: wide lens, about 28 to 35 millimetres
  conflicts: []
  evidence: MYSLEF EP-01 shots 03 and 06 are 35 mm.
  aliases:
  - wide lens
  - 28mm
  - 35mm
  lens_mm_min: 28
  lens_mm_max: 35
  provider_notes: Close + wide inflates head ratio ~+0.05-0.10; keep distance or use 50mm for singles.
- id: normal-lens
  category: lens_band
  definition: A normal lens, around 50 mm, keeps relative sizes close to what the eye expects at that
    distance.
  prompt_phrase: normal lens, around 50 millimetres
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - normal
  - normal lens
  - 50mm
  lens_mm_min: 40
  lens_mm_max: 65
  provider_notes: '''50mm'' or ''waist-up'' recommended over ''knees-up'' after EP-01 shot 11 (untested;
    calibrate).'
- id: short-tele
  category: lens_band
  definition: A short telephoto, around 85 mm, compresses the face slightly and lets the background fall
    back.
  prompt_phrase: short telephoto, around 85 millimetres
  conflicts: []
  evidence: MYSLEF EP-01 shot 05 is 85 mm.
  aliases:
  - short tele
  - short telephoto
  - 85mm
  - 85 mm
  lens_mm_min: 70
  lens_mm_max: 110
  provider_notes: Natural head ratio; compresses background; good for SRS singles.
- id: long-tele
  category: lens_band
  definition: A long telephoto, 135 mm or longer, stacks distant planes together and isolates a small
    subject.
  prompt_phrase: long telephoto, 135 millimetres or longer
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - long tele
  - long telephoto
  - 135mm
  lens_mm_min: 135
- id: macro
  category: lens_band
  definition: Macro framing focuses very near a surface. The subject is large in frame and the background
    drops out of focus.
  prompt_phrase: macro focus on a near surface
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - macro
  - macro lens
- id: static
  category: move
  definition: The camera stays fixed. It does not travel, pan, tilt, or zoom during the shot.
  prompt_phrase: locked-off camera, static, with no travel
  conflicts: []
  evidence: MYSLEF EP-01 shot 05 is a locked view.
  aliases:
  - static
  - locked
  - locked-off
  - locked off
- id: pan
  category: move
  definition: The camera turns left or right from one fixed spot, without travelling through the room.
  prompt_phrase: pan left or right from a fixed spot
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - pan
- id: tilt
  category: move
  definition: The camera pivots up or down from one fixed spot. A tilt-down aims the lens toward the floor.
  prompt_phrase: tilt up or down from a fixed spot
  conflicts: []
  evidence: MYSLEF EP-01 shot 04 tilts down near 4.1 seconds.
  aliases:
  - tilt
  - tilt-down
  - tilt down
  - tilt-up
  - tilt up
- id: snap-pan
  category: move
  definition: A snap pan yanks the aim from one direction to another in a single fast turn, with no travel
    of the camera body.
  prompt_phrase: snap pan, a sudden fast pan to a new aim
  conflicts:
  - chain_from_start_frame
  evidence: MYSLEF EP-01 lost a snap pan on shot 04 because that shot chained from shot 03's last frame.
  provider_notes: A chain that starts on an earlier frame already shows that frame, so the discontinuous
    pan is not visible inside the chain.
  aliases:
  - snap
  - snap pan
  - snap-pan
- id: whip-pan
  category: move
  definition: A whip pan turns so fast that the middle of the move smears and the new aim arrives at the
    end.
  prompt_phrase: whip pan, a pan fast enough to blur the middle
  conflicts:
  - chain_from_start_frame
  evidence: Working definition for the Kubrick film-grammar registry. The same chain limit as a snap pan
    applies.
  provider_notes: A chained start image cannot show the blurred middle of a whip. The conflict is warned
    instead of dropped in silence.
  aliases:
  - whip
  - whip pan
  - whip-pan
- id: push-in
  category: move
  definition: The camera travels forward along its lens axis, so the subject grows in frame without a
    zoom.
  prompt_phrase: push-in toward the subject
  conflicts:
  - static
  - pull-out
  - zoom
  evidence: MYSLEF EP-01 shots 03 and 06 are 35 mm push-ins.
  aliases:
  - push in
  - push-in
  - slow push-in
  - slow push in
  provider_notes: EP-01 09 t1 ended at ~0.50 head ratio against a 0.40-0.45 target (t2 held); supply an
    end board.
  targets:
    delta_head_ratio:
    - -0.03
    - 0.03
- id: pull-out
  category: move
  definition: The camera travels backward along its lens axis, so more of the room enters the frame.
  prompt_phrase: pull-out away from the subject
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - pull out
  - pull-out
- id: dolly
  category: move
  definition: The camera travels on a mount. A dolly moves along the lens axis and a truck moves sideways.
    The body of the camera changes place.
  prompt_phrase: dolly or truck, the camera travelling on a mount
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - dolly
  - truck
  - dolly in
  - truck left
- id: track
  category: move
  definition: The camera travels with a moving subject and keeps that subject in frame while the background
    slides.
  prompt_phrase: tracking shot that follows the moving subject
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - track
  - tracking
  - follow
  - follow shot
- id: arc
  category: move
  definition: The camera moves in a curve around the subject, so the background swings behind them.
  prompt_phrase: arc or orbit around the subject
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - arc
  - orbit
  - arc shot
- id: crane
  category: move
  definition: The camera rises or drops as a unit, on a crane arm or a pedestal, rather than only tilting
