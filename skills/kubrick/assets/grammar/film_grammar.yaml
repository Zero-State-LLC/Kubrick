  - chain
- id: headroom
  category: composition_9_16
  definition: In a tall frame, space remains above the head so the subject is not pressed against the
    top edge.
  prompt_phrase: headroom above the subject in the tall frame
  conflicts:
  - negative-space-top
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - headroom
  - head room
  provider_notes: Eyes ~1/3 down; in 9:16 eyes must also clear top safe zone (y>=220px @1080x1920).
  targets:
    headroom_frac:
    - 0.04
    - 0.12
    eye_y:
    - 0.28
    - 0.4
- id: lead-room
  category: composition_9_16
  definition: Empty space sits in front of the direction a subject looks or moves, including down a tall
