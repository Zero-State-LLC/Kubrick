  prompt_phrase: stabilised float, a smooth moving camera without handheld shake
  conflicts: []
  evidence: Working definition for the Kubrick film-grammar registry.
  aliases:
  - stabilised
  - stabilized
  - stabilised float
  - stabilized float
- id: zoom
  category: move
  definition: Focal length changes during the shot while the camera body stays in one place. The frame
