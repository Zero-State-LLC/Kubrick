[project]
name = "kubrick-skill"
version = "0.27.11"
description = "Development metadata for the standalone Kubrick Hermes skill"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6",
  "jsonschema>=4",
]

[project.optional-dependencies]
validation = ["PyYAML>=6", "jsonschema>=4"]
# Local, CPU-only models for the board image gate (DINOv2 identity check).
# Never installed in CI and never imported at module load.
board-vision = ["torch>=2.2", "transformers>=4.40", "Pillow>=10"]
dev = [
  "pytest>=8",
  "ruff>=0.12",
  "mypy>=1.16",
  "PyYAML>=6",
  "types-PyYAML>=6",
  "jsonschema>=4",
]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 100
# The hub mirror is a generated copy of the root; lint the root only (#72).
extend-exclude = ["skills"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/surface_*.py" = ["E501"]
"src/kubrick/surfaces/surface_*.py" = ["E501"]
"scripts/test_surface_compilers.py" = ["E501"]
"scripts/production_surface.py" = ["E501"]
"src/kubrick/surfaces/production_surface.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true

# Kubrick remains a self-contained Hermes skill directory. This file only
# formalizes interpreter compatibility and optional validation/dev profiles.
