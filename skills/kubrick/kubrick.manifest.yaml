{
  "manifest_version": 1,
  "name": "kubrick",
  "version": "0.17.0",
  "host": "hermes",
  "runtime_profiles": {
    "prose": {
      "dependencies": [],
      "guarantee": "Creative routing, diagnosis, drafting, revision, symbolic translation, and first-class design/script/image/video workflows through SKILL.md and references."
    },
    "stdlib": {
      "dependencies": [],
      "guarantee": "Core routing, structural validation, deterministic hashing, graph operations, production-surface contracts, and JSON artifacts with Python 3.10+."
    },
    "validation": {
      "dependencies": [
        "PyYAML==6.0.2",
        "jsonschema==4.25.0"
      ],
      "guarantee": "Full YAML parsing and JSON Schema validation."
    },
    "dev": {
      "dependencies": [
        "pytest==8.4.1",
        "ruff==0.12.7",
        "mypy==1.17.0",
        "PyYAML==6.0.2",
        "jsonschema==4.25.0"
      ],
      "guarantee": "Tests, static checks, corpus QA, and release validation."
    }
  },
  "intents": {
    "compile": {
      "description": "Full brief-to-packet compile",
      "default_action": "run",
      "actions": {
        "run": "kubrick_compile.py"
      }
    },
    "retrieve": {
      "description": "Registry-aware pattern retrieval",
      "default_action": "retrieve",
      "actions": {
        "retrieve": "retrieve_symbolic_patterns_registry.py"
      }
    },
    "ledger": {
      "description": "Project symbolic ledger",
      "default_action": null,
      "actions": {
        "init": "symbolic_ledger.py",
        "audit": "symbolic_ledger.py",
        "mutate": "symbolic_ledger.py",
        "rehydrate": "symbolic_ledger.py",
        "apply-forge": "symbolic_ledger.py",
        "export-retrieval": "symbolic_ledger.py",
        "record-pattern": "symbolic_ledger.py"
      }
    },
    "design": {
      "description": "First-class design.md lifecycle",
      "default_action": "create",
      "actions": {
        "build": "design_surface.py",
        "create": "design_surface.py",
        "improve": "design_surface.py",
        "audit": "design_surface.py",
        "reconcile": "design_surface.py",
        "drift": "design_surface.py",
        "update": "design_surface.py",
        "validate": "design_surface.py",
        "expand": "design_surface.py",
        "summarize": "design_surface.py",
        "qa": "design_surface.py"
      }
    },
    "script": {
      "description": "First-class script development and continuity",
      "default_action": "create",
      "actions": {
        "create": "script_surface.py",
        "improve": "script_surface.py",
        "rewrite": "script_surface.py",
        "expand": "script_surface.py",
        "compress": "script_surface.py",
        "diagnose": "script_surface.py",
        "adapt": "script_surface.py",
        "continuity": "script_surface.py",
        "continuity-check": "script_surface.py",
        "handoff": "script_surface.py",
        "scene-extract": "script_surface.py",
        "beat-validate": "script_surface.py",
        "character-consistency": "script_surface.py",
        "dialog-validate": "script_surface.py",
        "genre-validate": "script_surface.py",
        "qa": "script_surface.py"
      }
    },
    "image": {
      "description": "First-class still-image prompt engineering",
      "default_action": "prompt",
      "actions": {
        "prompt": "image_surface.py",
        "generate": "image_surface.py",
        "improve": "image_surface.py",
        "sequence": "image_surface.py",
        "batch": "image_surface.py",
        "reference": "image_surface.py",
        "negative": "image_surface.py",
        "adapt": "image_surface.py",
        "composition": "image_surface.py",
        "lighting": "image_surface.py",
        "camera": "image_surface.py",
        "symbol-extract": "image_surface.py",
        "qa": "image_surface.py"
      }
    },
    "video": {
      "description": "First-class temporal video prompt engineering",
      "default_action": "shot",
      "actions": {
        "shot": "video_surface.py",
        "prompt": "video_surface.py",
        "motion": "video_surface.py",
        "blocking": "video_surface.py",
        "sequence": "video_surface.py",
        "transition": "video_surface.py",
        "animation": "video_surface.py",
        "timeline": "video_surface.py",
        "continuity": "video_surface.py",
        "adapt": "video_surface.py",
        "qa": "video_surface.py"
      }
    },
    "storyboard": {
      "description": "Multi-frame state",
      "default_action": null,
      "actions": {
        "propagate": "propagate_graph_state.py",
        "compare": "compare_frame_state.py"
      }
    },
    "adapt": {
      "description": "Neutral packet and provider adaptation",
      "default_action": "build",
      "actions": {
        "build": "build_model_adapter_packet.py",
        "provider": "adapt_provider.py"
      }
    },
    "visual": {
      "description": "Visual QA loop",
      "default_action": null,
      "actions": {
        "normalize": "normalize_visual_observation.py",
        "compare": "compare_visual_observation.py",
        "correct": "build_visual_correction_packet.py",
        "govern": "govern_correction_iteration.py",
        "closed-loop": "closed_loop_visual_qa.py"
      }
    },
    "learn": {
      "description": "Outcomes and multi-signal evolution",
      "default_action": null,
      "actions": {
        "outcome": "record_pattern_outcome.py",
        "evolve": "propose_pattern_evolution.py",
        "forge-signals": "extract_forge_signals.py"
      }
    },
    "check": {
      "description": "Validation and regression",
      "default_action": "smoke",
      "actions": {
        "skill": "validate_hermes_skill.py",
        "manifest": "validate_manifest.py",
        "corpus": "validate_pattern_corpus.py",
        "coverage": "audit_corpus_coverage.py",
        "artifact": "validate_artifact.py",
        "repeatability": "check_repeatability.py",
        "release": "audit_release_version.py",
        "eval": "run_hermes_evals.py",
        "smoke": "validate_hermes_skill.py",
        "hub-sync": "check_hub_sync.py"
      }
    },
    "operate": {
      "description": "Graph/ledger operators",
      "default_action": null,
      "actions": {
        "saturation-score": "graph_operators.py",
        "counterpoint": "graph_operators.py",
        "convergence-lock": "graph_operators.py",
        "surface-occult-audit": "graph_operators.py",
        "symbolic-architecture-export": "graph_operators.py",
        "motif-mutation": "graph_operators.py"
      }
    },
    "mcp": {
      "description": "Optional MCP server",
      "default_action": "serve",
      "actions": {
        "serve": "mcp_kubrick_server.py"
      }
    },
    "bundle": {
      "description": "Grok review bundle",
      "default_action": "build",
      "actions": {
        "build": "build_grok_review_bundle.py"
      }
    },
    "wizard": {
      "description": "Guided plan/execute for Hermes (answers JSON or interactive TTY)",
      "default_action": "plan",
      "actions": {
        "plan": "kubrick_wizard.py"
      }
    }
  },
