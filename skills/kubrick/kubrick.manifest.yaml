      "--mode",
      "storyboard",
      "--storyboard-plan",
      "examples/authority-transfer-storyboard/storyboard-plan.yaml",
      "--provider",
      "grok-imagine",
      "--out",
      "out/kubrick/authority-transfer"
    ],
    "design-improvement": [
      "do",
