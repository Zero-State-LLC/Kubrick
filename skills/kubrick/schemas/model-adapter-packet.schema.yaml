$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kubrick.zero-state.dev/schemas/model-adapter-packet.schema.yaml
title: Kubrick Model Adapter Packet
type: object
additionalProperties: false
required: [schema_version, adapter_id, provider, source_graph_id, mode, shared_constraints, frames, private_state_policy, validation]
properties:
  schema_version: {const: 1.0.0}
  adapter_id: {type: string, minLength: 1}
  provider: {type: string, minLength: 1}
  source_graph_id: {type: string, minLength: 1}
  mode: {enum: [single-frame, storyboard]}
  shared_constraints:
    type: object
    additionalProperties: false
    required: [visual_identity, continuity_rules, prohibited_resets, negative_constraints]
    properties:
      visual_identity: {type: array, items: {type: string}}
      continuity_rules: {type: array, items: {type: string}}
      prohibited_resets: {type: array, items: {type: string}}
      negative_constraints: {type: array, items: {type: string}}
      character_locks:
        type: array
        items: {type: string}
        description: Identity constraints from the brief character_locks field and character-lock or identity-lock production constraints.
      aspect_ratio:
        type: string
        minLength: 1
        description: Explicit N:M frame shape derived from aspect_ratio or a production_constraints token.
      production_constraints: {type: array, items: {type: string}}
  frames:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [frame_id, prompt, state_constraints, continuity_from_previous]
      properties:
        frame_id: {type: string, minLength: 1}
        prompt: {type: string, minLength: 1}
        state_constraints: {type: array, items: {type: string}}
        continuity_from_previous: {type: array, items: {type: string}}
        provider_parameters: {type: object}
  private_state_policy:
    type: object
    additionalProperties: false
    required: [graph_mutation_allowed, pattern_links_exposed, lexicon_links_exposed]
    properties:
      graph_mutation_allowed: {const: false}
      pattern_links_exposed: {const: false}
      lexicon_links_exposed: {const: false}
  characters: {type: object, additionalProperties: true}
  props: {type: object, additionalProperties: true}
  location: {type: object, additionalProperties: true}
  counts: {type: object, additionalProperties: {type: integer, minimum: 0}}
  locks: {type: array, items: {type: object, additionalProperties: true}}
  keep: {type: array, items: {type: string, minLength: 1}}
  strict: {type: boolean}
  short_beat_threshold_seconds: {type: number, exclusiveMinimum: 0}
  audio_strategy: {enum: [native, external, muted_native]}
  budget_cap_credits: {type: number, minimum: 0}
  model: {type: string, minLength: 1}
  input_mode: {type: string, minLength: 1}
  as_of: {type: string, minLength: 1}
  drift_max_age_days: {type: integer, minimum: 0}
  capability_max_age_days: {type: integer, minimum: 0}
  prep_warnings:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [code, shot, message, recommendation]
      properties:
        code: {type: string}
        shot: {type: [string, "null"]}
        character: {type: string}
        message: {type: string}
        recommendation: {type: string}
        evidence: {type: string}
        observed_on: {type: string}
  technique_suggestions:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, shot, intent, prompt_template, trim_guidance, applied, evidence]
      properties:
        id: {type: string}
        shot: {type: string}
        intent: {type: string}
        prompt_template: {type: string}
        trim_guidance: {type: string}
        applied: {type: boolean}
        evidence: {type: string}
  validation:
    type: object
    additionalProperties: false
    required: [status, errors, warnings]
    properties:
      status: {enum: [VALID, INVALID, NOT_COMPUTABLE]}
      errors: {type: array, items: {type: string}}
      warnings: {type: array, items: {type: string}}
