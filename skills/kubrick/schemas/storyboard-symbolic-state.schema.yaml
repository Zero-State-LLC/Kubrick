$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kubrick.zero-state.dev/schemas/storyboard-symbolic-state.schema.yaml
title: Kubrick Storyboard Symbolic State
type: object
additionalProperties: false
required: [schema_version, storyboard_id, graph_id, frames, validation]
properties:
  schema_version: {const: 1.0.0}
  storyboard_id: {type: string, minLength: 1}
  graph_id: {type: string, minLength: 1}
  frames:
    type: array
    minItems: 2
    items:
      type: object
      additionalProperties: false
      required: [frame_id, ordinal, node_states, motif_ownership, residue, convergence_sites, prohibited_resets]
      properties:
        frame_id: {type: string, minLength: 1}
        ordinal: {type: integer, minimum: 1}
        node_states: {type: object, additionalProperties: {type: string}}
        motif_ownership: {type: object, additionalProperties: {type: [string, 'null']}}
        object_states: {type: object, additionalProperties: {type: string}}
        light_states: {type: object, additionalProperties: {type: string}}
        material_states: {type: object, additionalProperties: {type: string}}
        residue: {type: array, items: {type: string}}
        convergence_sites: {type: array, items: {type: string}}
        required_mutations: {type: array, items: {type: string}}
        prohibited_resets: {type: array, items: {type: string}}
        duration_seconds:
          type: number
          description: Optional shot length in seconds. Keyframe allows 3–60 inclusive.
        title: {type: string, description: Optional Keyframe shot title.}
        scene: {type: string, description: Optional Keyframe scene label.}
        sound:
          type: string
          description: Optional Keyframe audio.sound. Omitted sound uses evidenced room presence.
        speech_lines:
          type: array
          items: {type: string}
          description: Optional dialogue lines. Speech is omitted when this list is empty.
        join:
          description: Optional cut, or a chain_from object pointing at an earlier frame.
          oneOf:
            - const: cut
            - type: object
              additionalProperties: false
              required: [chain_from]
              properties:
                chain_from: {type: string, minLength: 1}
                at_seconds: {type: number}
        opens_with: {type: string}
        prop_states: {type: object, additionalProperties: {type: string}}
        characters: {type: array, items: {type: string}}
        wardrobe:
          oneOf:
            - type: string
            - type: object
              additionalProperties: {type: string}
        apply_techniques: {type: array, items: {type: string}}
        action: {type: string}
        reference_images: {type: array, items: {type: string, minLength: 1}}
  props:
    type: object
    additionalProperties: true
    description: Optional prop registry. States are ordered. Frames declare prop_states.
  characters:
    type: object
    additionalProperties: true
    description: Optional character wardrobe and author-supplied reference manifests.
  short_beat_threshold_seconds: {type: number, exclusiveMinimum: 0}
  strict: {type: boolean}
  validation:
    type: object
    additionalProperties: false
    required: [status, errors, warnings, frame_count]
    properties:
      status: {enum: [VALID, INVALID, NOT_COMPUTABLE]}
      errors: {type: array, items: {type: string}}
      warnings: {type: array, items: {type: string}}
      frame_count: {type: integer, minimum: 0}
