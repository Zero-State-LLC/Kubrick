$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kubrick.zero-state.dev/schemas/storyboard-symbolic-state.schema.yaml
title: Kubrick Storyboard Symbolic State
type: object
additionalProperties: false
required: [schema_version, storyboard_id, graph_id, frames, validation]
properties:
  schema_version: {const: 1.0.0}
  storyboard_id: {type: string, minLength: 1}
  graph_id: {type: string, minLength: 1}
  frames:
    type: array
    minItems: 2
    items:
      type: object
      additionalProperties: false
      required: [frame_id, ordinal, node_states, motif_ownership, residue, convergence_sites, prohibited_resets]
      properties:
        frame_id: {type: string, minLength: 1}
        ordinal: {type: integer, minimum: 1}
        node_states: {type: object, additionalProperties: {type: string}}
        motif_ownership: {type: object, additionalProperties: {type: [string, 'null']}}
        object_states: {type: object, additionalProperties: {type: string}}
        light_states: {type: object, additionalProperties: {type: string}}
        material_states: {type: object, additionalProperties: {type: string}}
        residue: {type: array, items: {type: string}}
        convergence_sites: {type: array, items: {type: string}}
        required_mutations: {type: array, items: {type: string}}
        prohibited_resets: {type: array, items: {type: string}}
        duration_seconds:
          type: number
          description: Optional shot length in seconds. Keyframe Seedance 2.5 allows whole seconds from 4 to 30.
        title: {type: string, description: Optional Keyframe shot title.}
        scene: {type: string, description: Optional Keyframe scene label.}
        sound:
          type: string
          description: Optional Keyframe audio.sound. Omitted sound uses evidenced room presence.
        speech_lines:
          type: array
          items:
            oneOf:
              - {type: string}
              - type: object
                additionalProperties: false
                required: [character, line]
                properties:
                  character: {type: string, minLength: 1}
                  line: {type: string}
          description: Optional dialogue. A string or a character and line mapping. Speech is omitted when empty.
        join:
          description: Optional cut, or a chain_from object pointing at an earlier frame.
          oneOf:
            - const: cut
            - type: object
              additionalProperties: false
              required: [chain_from]
              properties:
                chain_from: {type: string, minLength: 1}
                at_seconds: {type: number}
        opens_with: {type: string}
        prop_states: {type: object, additionalProperties: {type: string}}
        characters: {type: array, items: {type: string}}
        wardrobe:
          oneOf:
            - type: string
            - type: object
              additionalProperties: {type: string}
        apply_techniques: {type: array, items: {type: string}}
        action: {type: string}
        reference_images: {type: array, items: {type: string, minLength: 1}}
        cast: {type: array, items: {type: string}}
        counts: {type: object, additionalProperties: {type: integer, minimum: 0}}
        shot_id: {type: string}
        location:
          description: Optional shot location. A prop lock does not carry across a location change.
          oneOf:
            - {type: string, minLength: 1}
            - type: object
              additionalProperties: false
              properties:
                id: {type: string, minLength: 1}
                name: {type: string, minLength: 1}
        view:
          enum: [front, rear, pov]
          description: Optional camera view. Rear adds rear-hold wording. POV drops wardrobe and asymmetry.
        screen_side:
          type: object
          additionalProperties: {enum: [left, right, center]}
        axis_change: {type: boolean}
        keep:
          type: array
          items: {type: string, minLength: 1}
          description: Names a flicker or clear must not remove from this frame.
        start_frame:
          type: object
          additionalProperties: true
          properties:
            source_take: {type: string}
            at_seconds: {type: number}
            asset: {type: string}
            verified: {type: boolean}
        camera:
          type: object
          additionalProperties: false
          description: Optional shot grammar. Known terms expand from the film grammar registry.
          properties:
            size:
              description: Shot size id, or a list of them.
              oneOf:
                - {type: string}
                - {type: array, items: {type: string}}
            angle:
              description: Camera angle id, or a list of them.
              oneOf:
                - {type: string}
                - {type: array, items: {type: string}}
            lens_mm:
              type: number
              exclusiveMinimum: 0
              description: Focal length in millimetres. Mapped to a lens band by range.
            move:
              description: Camera move id, or a list of them.
              oneOf:
                - {type: string}
                - {type: array, items: {type: string}}
            focus:
              description: Focus move id, such as rack focus, or a list of them.
              oneOf:
                - {type: string}
                - {type: array, items: {type: string}}
        cut:
          description: Edit type into this frame. A grammar id, or a list of them.
          oneOf:
            - {type: string}
            - {type: array, items: {type: string}}
        framing:
          type: object
          additionalProperties: true
          description: Numeric start framing. Head ratio is a two-number band.
        end_framing:
          type: object
          additionalProperties: true
          description: Numeric end framing. An anchor when size, crop, or head ratio changes.
        continuity:
          type: object
          additionalProperties: true
          description: Axis side, and whether a crossing is bridged.
        location_ref:
          type: object
          additionalProperties: true
          description: Location plate and precrop_to when a tight crop needs a pre-cropped plate.
  props:
    type: object
    additionalProperties: true
    description: Optional prop registry. States are ordered. Frames declare prop_states.
  characters:
    type: object
    additionalProperties: true
    description: Optional character wardrobe and author-supplied reference manifests.
  keep:
    type: array
    items: {type: string, minLength: 1}
    description: Names a flicker or clear must not remove from any frame.
  short_beat_threshold_seconds: {type: number, exclusiveMinimum: 0}
  audio_strategy: {enum: [native, external, muted_native]}
  budget_cap_credits: {type: number, minimum: 0}
  model: {type: string, minLength: 1}
  input_mode: {type: string, minLength: 1}
  as_of: {type: string, minLength: 1}
  drift_max_age_days: {type: integer, minimum: 0}
  capability_max_age_days: {type: integer, minimum: 0}
  strict: {type: boolean}
  location:
    type: object
    additionalProperties: true
    description: Optional room locks and location references. Read from the storyboard plan.
  counts:
    type: object
    additionalProperties: {type: integer, minimum: 0}
    description: Optional count locks. A frame counts entry overrides one key.
  locks:
    type: array
    description: Optional critical locks that are not character locks.
    items: {type: object, additionalProperties: true}
  hold_list:
    type: array
    description: Optional scoped holds. Each hold can name locations, shots, characters, an anchor, views, and salience.
    items:
      oneOf:
        - {type: string, minLength: 1}
        - type: object
          additionalProperties: true
          properties:
            id: {type: string, minLength: 1}
            anchor: {type: string, minLength: 1}
            salience: {type: number, minimum: 0, maximum: 1}
            rear: {type: string, minLength: 1}
            views:
              type: array
              items: {enum: [front, rear, pov]}
            scope:
              type: object
              additionalProperties: false
              properties:
                locations: {type: array, items: {type: string, minLength: 1}}
                shots: {type: array, items: {type: string, minLength: 1}}
                characters: {type: array, items: {type: string, minLength: 1}}
  delivery:
    type: object
    additionalProperties: true
    description: Delivery target. platform names the safe-zone size. The box scales from 1080 by 1920.
  validation:
    type: object
    additionalProperties: false
    required: [status, errors, warnings, frame_count]
    properties:
      status: {enum: [VALID, INVALID, NOT_COMPUTABLE]}
      errors: {type: array, items: {type: string}}
      warnings: {type: array, items: {type: string}}
      frame_count: {type: integer, minimum: 0}
