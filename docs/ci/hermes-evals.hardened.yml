name: Hermes Skill Evals
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  stdlib-contract:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/validate_manifest.py
      - run: python scripts/validate_hermes_skill.py
      - run: python scripts/test_intent_router.py
      - run: python scripts/test_diagnostics.py
      - run: python scripts/test_io_safety.py
      - run: python scripts/test_surface_compilers.py
      - run: python scripts/test_cross_surface.py
      - run: python scripts/audit_release_version.py --strict

  validation-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/validate_manifest.py
      - run: python scripts/check_hub_sync.py
      - run: python scripts/audit_corpus_coverage.py
      - run: python scripts/test_diagnostics.py
      - run: python scripts/test_io_safety.py
      - run: python scripts/test_surface_compilers.py
      - run: python scripts/test_cross_surface.py
      - run: python scripts/test_adapter_preservation.py
      - run: python scripts/test_installer.py
      - run: python scripts/test_receipt_identity.py
      - run: python scripts/run_hermes_evals.py
      - run: python scripts/test_outcome_governance.py
      - run: python scripts/test_wave2_wave3.py
      - name: Compile canonical storyboard example
        run: |
          python scripts/kubrick.py compile --brief examples/authority-transfer-storyboard/brief.yaml --ledger examples/authority-transfer-storyboard/symbolic-ledger.yaml --mode storyboard --storyboard-plan examples/authority-transfer-storyboard/storyboard-plan.yaml --provider grok-imagine --out out/kubrick/example
      - name: Compile multi-provider adapter packets
        run: |
          python scripts/kubrick.py compile --brief examples/authority-transfer-storyboard/brief.yaml --ledger examples/authority-transfer-storyboard/symbolic-ledger.yaml --mode storyboard --storyboard-plan examples/authority-transfer-storyboard/storyboard-plan.yaml --provider flux --out out/kubrick/example-flux
          python scripts/kubrick.py compile --brief examples/authority-transfer-storyboard/brief.yaml --ledger examples/authority-transfer-storyboard/symbolic-ledger.yaml --mode storyboard --storyboard-plan examples/authority-transfer-storyboard/storyboard-plan.yaml --provider sd3 --out out/kubrick/example-sd3
          python scripts/kubrick.py compile --brief examples/authority-transfer-storyboard/brief.yaml --ledger examples/authority-transfer-storyboard/symbolic-ledger.yaml --mode storyboard --storyboard-plan examples/authority-transfer-storyboard/storyboard-plan.yaml --provider midjourney --out out/kubrick/example-midjourney
      - name: Verify deterministic repeatability
        run: python scripts/kubrick.py repeatability --output out/kubrick/repeatability-report.json
      - name: Verify release version alignment
        run: python scripts/audit_release_version.py --strict --output out/kubrick/release-version-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kubrick-eval-report
          path: out/kubrick/

  dev-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - run: ruff check scripts/io_safety.py scripts/provenance.py scripts/check_hub_sync.py scripts/mcp_kubrick_server.py scripts/production_surface.py scripts/surface_compilers.py
      - run: mypy --follow-imports=skip --ignore-missing-imports scripts/io_safety.py scripts/provenance.py scripts/check_hub_sync.py scripts/manifest_contract.py scripts/diagnostics.py
      - name: Lint ratchet (per-file ruff/mypy counts may only fall)
        run: python scripts/check_lint_ratchet.py
      - run: pytest -q scripts/test_io_safety.py scripts/test_intent_router.py scripts/test_diagnostics.py scripts/test_surface_compilers.py
