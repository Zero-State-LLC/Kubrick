name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-ci.txt
    - name: Run tests with subprocess-aware coverage
      env:
        KUBRICK_COVERAGE_ROOT: ${{ github.workspace }}
        COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
      run: |
        set -euo pipefail
        site="$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
        echo "import coverage; coverage.process_startup()" > "$site/kubrick-coverage.pth"
        mkdir -p out/coverage
        python -m coverage run -m pytest -q scripts tests tests_audit
        for test in scripts/test_*.py; do
          python -m coverage run "$test"
        done
        python -m coverage run scripts/run_hermes_evals.py > /dev/null
        python scripts/check_hub_sync.py
        python -m coverage combine -q
        python -m coverage report --fail-under=75 | tail -n 1
    - name: Working tree is clean after tests and evals
      run: |
        dirty="$(git status --porcelain)"
        if [ -n "$dirty" ]; then
          echo "tests or evals left files in the tree:"
          echo "$dirty"
          exit 1
        fi
